openapi: 3.2.0
info:
  version: 0.1.87
  title: Blockfrost.io ~ API Documentation Cardano » Utilities API
  x-logo:
    url: https://staging.blockfrost.io/images/logo.svg
    altText: Blockfrost
  contact:
    name: Blockfrost Team
    url: https://blockfrost.io
    email: contact@blockfrost.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://blockfrost.io/terms
  description: Blockfrost is an API as a service that allows users to interact with the Cardano blockchain, Midnight blockchain, and parts of their ecosystems.
servers:
- url: https://cardano-mainnet.blockfrost.io/api/v0
  description: Cardano Mainnet network
- url: https://cardano-preprod.blockfrost.io/api/v0
  description: Cardano Preprod network
- url: https://cardano-preview.blockfrost.io/api/v0
  description: Cardano Preview network
- url: https://localhost:3000
  description: local
security:
- project_id: []
tags:
- name: Cardano » Utilities
paths:
  /utils/addresses/xpub/{xpub}/{role}/{index}:
    get:
      tags:
      - Cardano » Utilities
      summary: Blockfrost Derive an Address
      description: Derive Shelley address from an xpub
      parameters:
      - in: path
        name: xpub
        required: true
        schema:
          type: string
        description: Hex xpub
        example: d507c8f866691bd96e131334c355188b1a1d0b2fa0ab11545075aab332d77d9eb19657ad13ee581b56b0f8d744d66ca356b93d42fe176b3de007d53e9c4c4e7a
      - in: path
        name: role
        required: true
        schema:
          type: integer
        description: Account role
        example: 0
      - in: path
        name: index
        required: true
        schema:
          type: integer
        description: Address index
        example: 2
      responses:
        '200':
          description: Return derivated Shelley address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils_addresses_xpub'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getUtilsAddressesXpubByXpubByRoleByIndex
      x-operation-id-source: derived
  /utils/txs/evaluate:
    post:
      tags:
      - Cardano » Utilities
      summary: Blockfrost Submit a Transaction for Execution Units Evaluation
      description: 'Submit an already serialized transaction to evaluate how much execution units it requires.


        Hosted Endpoint only available for hosted variant.'
      parameters:
      - in: header
        name: Content-Type
        required: true
        schema:
          type: string
          enum:
          - application/cbor
      - in: query
        name: version
        required: false
        schema:
          type: number
          default: 5
        description: 'Optional parameter to specify the version of the Ogmios service to use. Default is `5`. Set to `6` to use Ogmios version 6.

          '
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: "# Assuming `tx.data` is a CBOR serialized transaction on the file-system.\n# (encoded using base16 or base64)\ncurl \"https://cardano-mainnet.blockfrost.io/api/v0/utils/txs/evaluate\" \\\n  -X POST \\\n  -H \"Content-Type: application/cbor\" \\\n  -H \"project_id: $PROJECT_ID\" \\\n  --data @./tx.data\n"
      requestBody:
        description: 'The transaction to submit, serialized in CBOR.

          '
        required: true
        content:
          application/cbor:
            schema:
              type: string
              description: 'The transaction to submit, serialized in CBOR.

                '
            example: '

              '
      responses:
        '200':
          description: "<p>\n  <div class=\"custom-paragraph\">\n    Returns result of EvaluateTx function from Ogmios see <a class=\"custom-link\" href=\"https://ogmios.dev/mini-protocols/local-tx-submission/#evaluatetx\">EvaluateTx</a>\n    and<a href=\"https://ogmios.dev/http-api/\"> API reference (EvaluateTxResponse)</a> for related errors.\n  </div>\n</p>\n"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '425':
          $ref: '#/components/responses/425'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: postUtilsTxsEvaluate
      x-operation-id-source: derived
  /utils/txs/evaluate/utxos:
    post:
      tags:
      - Cardano » Utilities
      summary: Blockfrost Submit a Transaction for Execution Units Evaluation (additional UTXO…
      description: 'Submit a JSON payload with transaction CBOR and additional UTXO set to evaluate how much execution units it requires.


        Hosted Endpoint only available for hosted variant.'
      parameters:
      - in: header
        name: Content-Type
        required: true
        schema:
          type: string
          enum:
          - application/json
      - in: query
        name: version
        required: false
        schema:
          type: number
          default: 5
        description: 'Optional parameter to specify the version of the Ogmios service to use. Default is `5`. Set to `6` to use Ogmios version 6.

          '
      requestBody:
        description: JSON payload
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cbor:
                  type: string
                  description: Transaction CBOR (encoded using base64 or base16).
                additionalUtxoSet:
                  type: array
                  description: Additional UTXO as an array of tuples [TxIn, TxOut]. See https://ogmios.dev/mini-protocols/local-tx-submission/#additional-utxo-set.
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      anyOf:
                      - type: object
                        description: TxIn
                        properties:
                          txId:
                            type: string
                            description: Transaction hash for the input
                          index:
                            type: number
                            description: Index of the output within the transaction
                      - type: object
                        description: TxOut
                        properties:
                          address:
                            type: string
                            description: Output address
                          value:
                            type: object
                            properties:
                              coins:
                                type: number
                                description: Lovelace amount
                              assets:
                                type: object
                                description: Assets amount
                                additionalProperties:
                                  type: number
                            required:
                            - coins
                          datum_hash:
                            type: string
                          datum:
                            type: object
                            additionalProperties: true
                          script:
                            type: object
                            additionalProperties: true
                        required:
                        - address
                        - value
              required:
              - cbor
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: "# Assuming TxCbor is a CBOR serialized transaction encoded using base16 or base64\n# For a structure of additional UTXO set see https://ogmios.dev/mini-protocols/local-tx-submission/#additional-utxo-set\ncurl \"https://cardano-mainnet.blockfrost.io/api/v0/utils/txs/evaluate/utxos\" \\\n  -X POST \\\n  -H \"Content-Type: application/json\" \\\n  -H \"project_id: $PROJECT_ID\" \\\n  -d '{\"cbor\":\"<TxCbor>\",\"additionalUtxoSet\":[[<TxIn>, <TxOut>]]}'\n"
      responses:
        '200':
          description: "<p>\n  <div class=\"custom-paragraph\">\n    Returns result of EvaluateTx function from Ogmios see <a class=\"custom-link\" href=\"https://ogmios.dev/mini-protocols/local-tx-submission/#evaluatetx\">EvaluateTx</a>\n    and<a href=\"https://ogmios.dev/api/\"> API reference (EvaluateTxResponse)</a> for related errors.\n  </div>\n</p>\n"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '425':
          $ref: '#/components/responses/425'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: postUtilsTxsEvaluateUtxos
      x-operation-id-source: derived
components:
  responses:
    '425':
      description: Mempool is already full, not accepting new txs straight away
      content:
        application/json:
          schema:
            type: object
            properties:
              status_code:
                type: integer
                example: 425
              error:
                type: string
                example: Mempool Full
              message:
                type: string
                example: Mempool is full, please try resubmitting again later.
            required:
            - error
            - message
            - status_code
    '403':
      description: Authentication secret is missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              status_code:
                type: integer
                example: 403
              error:
                type: string
                example: Forbidden
              message:
                type: string
                example: Invalid project token.
            required:
            - error
            - message
            - status_code
    '429':
      description: Usage limit reached
      content:
        application/json:
          schema:
            type: object
            properties:
              status_code:
                type: integer
                example: 429
              error:
                type: string
                example: Project Over Limit
              message:
                type: string
                example: Usage is over limit.
            required:
            - error
            - message
            - status_code
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              status_code:
                type: integer
                example: 400
              error:
                type: string
                example: Bad Request
              message:
                type: string
                example: Backend did not understand your request.
            required:
            - error
            - message
            - status_code
    '404':
      description: Component not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status_code:
                type: integer
                example: 404
              error:
                type: string
                example: Not Found
              message:
                type: string
                example: The requested component has not been found.
            required:
            - error
            - message
            - status_code
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              status_code:
                type: integer
                example: 500
              error:
                type: string
                example: Internal Server Error
              message:
                type: string
                example: An unexpected response was received from the backend.
            required:
            - error
            - message
            - status_code
    '418':
      description: IP has been auto-banned for extensive sending of requests after usage limit has been reached
      content:
        application/json:
          schema:
            type: object
            properties:
              status_code:
                type: integer
                example: 418
              error:
                type: string
                example: Requested Banned
              message:
                type: string
                example: IP has been auto-banned for flooding.
            required:
            - error
            - message
            - status_code
  schemas:
    utils_addresses_xpub:
      type: object
      properties:
        xpub:
          type: string
          description: Script hash
        role:
          type: integer
          description: Account role
        index:
          type: integer
          description: Address index
        address:
          type: string
          description: Derived address
      required:
      - xpub
      - role
      - index
      - address
      example:
      - xpub: d507c8f866691bd96e131334c355188b1a1d0b2fa0ab11545075aab332d77d9eb19657ad13ee581b56b0f8d744d66ca356b93d42fe176b3de007d53e9c4c4e7a
        role: 0
        index: 0
        address: addr1q90sqnljxky88s0jsnps48jd872p7znzwym0jpzqnax6qs5nfrlkaatu28n0qzmqh7f2cpksxhpc9jefx3wrl0a2wu8q5amen7
  securitySchemes:
    project_id:
      type: apiKey
      in: header
      name: project_id
      description: 'There are multiple token types available based on network you choose

        when creating a Blockfrost a project, for a list of token types

        see available networks.

        '
