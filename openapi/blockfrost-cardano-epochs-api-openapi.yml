openapi: 3.2.0
info:
  version: 0.1.87
  title: Blockfrost.io ~ API Documentation Cardano » Epochs API
  x-logo:
    url: https://staging.blockfrost.io/images/logo.svg
    altText: Blockfrost
  contact:
    name: Blockfrost Team
    url: https://blockfrost.io
    email: contact@blockfrost.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://blockfrost.io/terms
  description: Blockfrost is an API as a service that allows users to interact with the Cardano blockchain, Midnight blockchain, and parts of their ecosystems.
servers:
- url: https://cardano-mainnet.blockfrost.io/api/v0
  description: Cardano Mainnet network
- url: https://cardano-preprod.blockfrost.io/api/v0
  description: Cardano Preprod network
- url: https://cardano-preview.blockfrost.io/api/v0
  description: Cardano Preview network
- url: https://localhost:3000
  description: local
security:
- project_id: []
tags:
- name: Cardano » Epochs
paths:
  /epochs/latest:
    get:
      tags:
      - Cardano » Epochs
      summary: Blockfrost Latest Epoch
      description: Return the information about the latest, therefore current, epoch.
      responses:
        '200':
          description: Return the data about the epoch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/epoch_content'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getEpochsLatest
      x-operation-id-source: derived
  /epochs/latest/parameters:
    get:
      tags:
      - Cardano » Epochs
      summary: Blockfrost Latest Epoch Protocol Parameters
      description: Return the protocol parameters for the latest epoch.
      responses:
        '200':
          description: Return the data about the epoch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/epoch_param_content'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getEpochsLatestParameters
      x-operation-id-source: derived
  /epochs/{number}:
    get:
      tags:
      - Cardano » Epochs
      summary: Blockfrost Specific Epoch
      description: Return the content of the requested epoch.
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
        description: Number of the epoch
        example: 225
      responses:
        '200':
          description: Return the epoch data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/epoch_content'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getEpochsByNumber
      x-operation-id-source: derived
  /epochs/{number}/next:
    get:
      tags:
      - Cardano » Epochs
      summary: Blockfrost Listing of Next Epochs
      description: Return the list of epochs following a specific epoch.
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
        description: Number of the requested epoch.
        example: 225
      - in: query
        name: count
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: The number of results displayed on one page.
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 21474836
          default: 1
        description: The page number for listing the results.
      responses:
        '200':
          description: Return the data about the epoch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/epoch_content_array'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getEpochsByNumberNext
      x-operation-id-source: derived
  /epochs/{number}/previous:
    get:
      tags:
      - Cardano » Epochs
      summary: Blockfrost Listing of Previous Epochs
      description: Return the list of epochs preceding a specific epoch.
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
        description: Number of the epoch
        example: 225
      - in: query
        name: count
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: The number of results displayed on one page.
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 21474836
          default: 1
        description: The page number for listing the results
      responses:
        '200':
          description: Return the epoch data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/epoch_content_array'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getEpochsByNumberPrevious
      x-operation-id-source: derived
  /epochs/{number}/stakes:
    get:
      tags:
      - Cardano » Epochs
      summary: Blockfrost Stake Distribution
      description: Return the active stake distribution for the specified epoch.
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
        description: Number of the epoch
        example: 225
      - in: query
        name: count
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: The number of results displayed on one page.
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 21474836
          default: 1
        description: The page number for listing the results.
      responses:
        '200':
          description: Return the data about the epoch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/epoch_stake_content'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getEpochsByNumberStakes
      x-operation-id-source: derived
  /epochs/{number}/stakes/{pool_id}:
    get:
      tags:
      - Cardano » Epochs
      summary: Blockfrost Stake Distribution by Pool
      description: Return the active stake distribution for the epoch specified by stake pool.
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
        description: Number of the epoch
        example: 225
      - in: path
        required: true
        name: pool_id
        schema:
          type: string
        description: Stake pool ID to filter
        example: pool1pu5jlj4q9w9jlxeu370a3c9myx47md5j5m2str0naunn2q3lkdy
      - in: query
        name: count
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: The number of results displayed on one page.
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 21474836
          default: 1
        description: The page number for listing the results.
      responses:
        '200':
          description: Return the data about the epoch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/epoch_stake_pool_content'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getEpochsByNumberStakesByPoolId
      x-operation-id-source: derived
  /epochs/{number}/blocks:
    get:
      tags:
      - Cardano » Epochs
      summary: Blockfrost Block Distribution
      description: Return the blocks minted for the epoch specified.
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
        description: Number of the epoch
        example: 225
      - in: query
        name: count
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: The number of results displayed on one page.
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 21474836
          default: 1
        description: The page number for listing the results.
      - in: query
        name: order
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        description: 'The ordering of items from the point of view of the blockchain,

          not the page listing itself. By default, we return oldest first, newest last.

          '
      responses:
        '200':
          description: Return the data about the epoch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/epoch_block_content'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getEpochsByNumberBlocks
      x-operation-id-source: derived
  /epochs/{number}/blocks/{pool_id}:
    get:
      tags:
      - Cardano » Epochs
      summary: Blockfrost Block Distribution by Pool
      description: Return the block minted for the epoch specified by stake pool.
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
        description: Number of the epoch
        example: 225
      - in: path
        required: true
        name: pool_id
        schema:
          type: string
        description: Stake pool ID to filter
        example: pool1pu5jlj4q9w9jlxeu370a3c9myx47md5j5m2str0naunn2q3lkdy
      - in: query
        name: count
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: The number of results displayed on one page.
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 21474836
          default: 1
        description: The page number for listing the results.
      - in: query
        name: order
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        description: 'The ordering of items from the point of view of the blockchain,

          not the page listing itself. By default, we return oldest first, newest last.

          '
      responses:
        '200':
          description: Return the data about the epoch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/epoch_block_content'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getEpochsByNumberBlocksByPoolId
      x-operation-id-source: derived
  /epochs/{number}/parameters:
    get:
      tags:
      - Cardano » Epochs
      summary: Blockfrost Protocol Parameters
      description: Return the protocol parameters for the epoch specified.
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
        description: Number of the epoch
        example: 225
      responses:
        '200':
          description: Return the data about the epoch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/epoch_param_content'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '418':
          $ref: '#/components/responses/418'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getEpochsByNumberParameters
      x-operation-id-source: derived
components:
  schemas:
    epoch_content:
      type: object
      properties:
        epoch:
          type: integer
          example: 225
          description: Epoch number
        start_time:
          type: integer
          example: 1603403091
          description: Unix time of the start of the epoch
        end_time:
          type: integer
          example: 1603835086
          description: Unix time of the end of the epoch
        first_block_time:
          type: integer
          example: 1603403092
          description: Unix time of the first block of the epoch
        last_block_time:
          type: integer
          example: 1603835084
          description: Unix time of the last block of the epoch
        block_count:
          type: integer
          example: 21298
          description: Number of blocks within the epoch
        tx_count:
          type: integer
          example: 17856
          description: Number of transactions within the epoch
        output:
          type: string
          example: '7849943934049314'
          description: Sum of all the transactions within the epoch in Lovelaces
        fees:
          type: string
          example: '4203312194'
          description: Sum of all the fees within the epoch in Lovelaces
        active_stake:
          type:
          - string
          - 'null'
          example: '784953934049314'
          description: Sum of all the active stakes within the epoch in Lovelaces
      required:
      - epoch
      - start_time
      - end_time
      - first_block_time
      - last_block_time
      - block_count
      - tx_count
      - output
      - fees
      - active_stake
    epoch_block_content:
      type: array
      items:
        type: string
        description: Hash of the block
      example:
      - d0fa315687e99ccdc96b14cc2ea74a767405d64427b648c470731a9b69e4606e
      - 38bc6efb92a830a0ed22a64f979d120d26483fd3c811f6622a8c62175f530878
      - f3258fcd8b975c061b4fcdcfcbb438807134d6961ec278c200151274893b6b7d
    epoch_param_content:
      type: object
      properties:
        epoch:
          type: integer
          example: 225
          description: Epoch number
        min_fee_a:
          type: integer
          example: 44
          description: The linear factor for the minimum fee calculation for given epoch
        min_fee_b:
          type: integer
          example: 155381
          description: The constant factor for the minimum fee calculation
        max_block_size:
          type: integer
          example: 65536
          description: Maximum block body size in Bytes
        max_tx_size:
          type: integer
          example: 16384
          description: Maximum transaction size
        max_block_header_size:
          type: integer
          example: 1100
          description: Maximum block header size
        key_deposit:
          type: string
          example: '2000000'
          description: The amount of a key registration deposit in Lovelaces
        pool_deposit:
          type: string
          example: '500000000'
          description: The amount of a pool registration deposit in Lovelaces
        e_max:
          type: integer
          example: 18
          description: Epoch bound on pool retirement
        n_opt:
          type: integer
          example: 150
          description: Desired number of pools
        a0:
          type: number
          example: 0.3
          description: Pool pledge influence
        rho:
          type: number
          example: 0.003
          description: Monetary expansion
        tau:
          type: number
          example: 0.2
          description: Treasury expansion
        decentralisation_param:
          type: number
          example: 0.5
          description: Percentage of blocks produced by federated nodes
        extra_entropy:
          type:
          - string
          - 'null'
          example: null
          description: Seed for extra entropy
        protocol_major_ver:
          type: integer
          example: 2
          description: Accepted protocol major version
        protocol_minor_ver:
          type: integer
          example: 0
          description: Accepted protocol minor version
        min_utxo:
          type: string
          example: '1000000'
          description: Minimum UTXO value. Use `coins_per_utxo_size` for Alonzo and later eras
          deprecated: true
        min_pool_cost:
          type: string
          example: '340000000'
          description: Minimum stake cost forced on the pool
        nonce:
          type: string
          example: 1a3be38bcbb7911969283716ad7aa550250226b76a61fc51cc9a9a35d9276d81
          description: Epoch number only used once
        cost_models:
          additionalProperties: true
          type:
          - object
          - 'null'
          example:
            PlutusV1:
              addInteger-cpu-arguments-intercept: 197209
              addInteger-cpu-arguments-slope: 0
            PlutusV2:
              addInteger-cpu-arguments-intercept: 197209
              addInteger-cpu-arguments-slope: 0
          description: Cost models parameters for Plutus Core scripts
        cost_models_raw:
          additionalProperties: true
          type:
          - object
          - 'null'
          example:
            PlutusV1:
            - 197209
            - 0
            PlutusV2:
            - 197209
            - 0
          description: Cost models parameters for Plutus Core scripts in raw list form
        price_mem:
          type:
          - number
          - 'null'
          example: 0.0577
          description: The per word cost of script memory usage
        price_step:
          type:
          - number
          - 'null'
          example: 7.21e-05
          description: The cost of script execution step usage
        max_tx_ex_mem:
          type:
          - string
          - 'null'
          example: '10000000'
          description: The maximum number of execution memory allowed to be used in a single transaction
        max_tx_ex_steps:
          type:
          - string
          - 'null'
          example: '10000000000'
          description: The maximum number of execution steps allowed to be used in a single transaction
        max_block_ex_mem:
          type:
          - string
          - 'null'
          example: '50000000'
          description: The maximum number of execution memory allowed to be used in a single block
        max_block_ex_steps:
          type:
          - string
          - 'null'
          example: '40000000000'
          description: The maximum number of execution steps allowed to be used in a single block
        max_val_size:
          type:
          - string
          - 'null'
          example: '5000'
          description: The maximum Val size
        collateral_percent:
          type:
          - integer
          - 'null'
          example: 150
          description: The percentage of the transactions fee which must be provided as collateral when including non-native scripts
        max_collateral_inputs:
          type:
          - integer
          - 'null'
          example: 3
          description: The maximum number of collateral inputs allowed in a transaction
        coins_per_utxo_size:
          type:
          - string
          - 'null'
          example: '34482'
          description: Cost per UTxO word for Alonzo. Cost per UTxO byte for Babbage and later.
        coins_per_utxo_word:
          type:
          - string
          - 'null'
          example: '34482'
          deprecated: true
          description: Cost per UTxO word for Alonzo. Cost per UTxO byte for Babbage and later.
        pvt_motion_no_confidence:
          type:
          - number
          - 'null'
          description: Pool Voting threshold for motion of no-confidence.
        pvt_committee_normal:
          type:
          - number
          - 'null'
          description: Pool Voting threshold for new committee/threshold (normal state).
        pvt_committee_no_confidence:
          type:
          - number
          - 'null'
          description: Pool Voting threshold for new committee/threshold (state of no-confidence).
        pvt_hard_fork_initiation:
          type:
          - number
          - 'null'
          description: Pool Voting threshold for hard-fork initiation.
        dvt_motion_no_confidence:
          type:
          - number
          - 'null'
          description: DRep Vote threshold for motion of no-confidence.
        dvt_committee_normal:
          type:
          - number
          - 'null'
          description: DRep Vote threshold for new committee/threshold (normal state).
        dvt_committee_no_confidence:
          type:
          - number
          - 'null'
          description: DRep Vote threshold for new committee/threshold (state of no-confidence).
        dvt_update_to_constitution:
          type:
          - number
          - 'null'
          description: DRep Vote threshold for update to the Constitution.
        dvt_hard_fork_initiation:
          type:
          - number
          - 'null'
          description: DRep Vote threshold for hard-fork initiation.
        dvt_p_p_network_group:
          type:
          - number
          - 'null'
          description: DRep Vote threshold for protocol parameter changes, network group.
        dvt_p_p_economic_group:
          type:
          - number
          - 'null'
          description: DRep Vote threshold for protocol parameter changes, economic group.
        dvt_p_p_technical_group:
          type:
          - number
          - 'null'
          description: DRep Vote threshold for protocol parameter changes, technical group.
        dvt_p_p_gov_group:
          type:
          - number
          - 'null'
          description: DRep Vote threshold for protocol parameter changes, governance group.
        dvt_treasury_withdrawal:
          type:
          - number
          - 'null'
          description: DRep Vote threshold for treasury withdrawal.
        committee_min_size:
          type:
          - string
          - 'null'
          description: Minimal constitutional committee size.
        committee_max_term_length:
          type:
          - string
          - 'null'
          description: Constitutional committee term limits.
        gov_action_lifetime:
          type:
          - string
          - 'null'
          description: Governance action expiration.
        gov_action_deposit:
          type:
          - string
          - 'null'
          description: Governance action deposit.
        drep_deposit:
          type:
          - string
          - 'null'
          description: DRep deposit amount.
        drep_activity:
          type:
          - string
          - 'null'
          description: DRep activity period.
        pvtpp_security_group:
          type:
          - number
          - 'null'
          deprecated: true
          description: Pool Voting threshold for security-relevant protocol parameters changes. Renamed to pvt_p_p_security_group.
        pvt_p_p_security_group:
          type:
          - number
          - 'null'
          description: Pool Voting threshold for security-relevant protocol parameters changes.
        min_fee_ref_script_cost_per_byte:
          type:
          - number
          - 'null'
      required:
      - epoch
      - min_fee_a
      - min_fee_b
      - max_block_size
      - max_tx_size
      - max_block_header_size
      - key_deposit
      - pool_deposit
      - e_max
      - n_opt
      - a0
      - rho
      - tau
      - decentralisation_param
      - extra_entropy
      - protocol_major_ver
